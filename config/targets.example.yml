# Copy to <project>/.audit/targets.yml and edit.
# Hosts not listed here are never contacted. Listing a host means you own it or have written permission to test it.
#
# env decides what may run:
#   local / dev / staging  passive and active checks
#   prod                   passive checks only (TLS check, slow port scan of your own IP, ZAP baseline, ZAP API scan -S)

targets:
  - name: api-local
    env: local
    url: http://127.0.0.1:3000

  - name: web-prod
    env: prod
    url: https://example.com
    ip: 192.0.2.10          # your own server only, never a CDN or a third party
    window: "Mon-Fri 20:00-23:00 Asia/Bangkok"

exclude:                    # never contacted, even if a URL above links to them
  - https://payment-gateway.example.net

rules:
  - id: sql-built-from-request
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A value from the request (a form field, URL, cookie or header) is put into the text of an SQL query. Someone can
      send a value such as ' OR '1'='1 or '; DROP TABLE users; -- and the database runs it as part of the query: read
      every row, log in as anyone, or change and delete data. Send the value apart from the SQL text with a
      placeholder: db.query('SELECT * FROM users WHERE email = $1', [email]) (pg), '?' with mysql2 or sqlite,
      replacements with Sequelize, or the tagged prisma.$queryRaw`... ${email}` instead of $queryRawUnsafe. Names that
      cannot be placeholders (a column to sort by) must be picked from a fixed list in the code.
    metadata:
      category: code
      # Shown in the report's list of what the code rules look for.
      summary: 'SQL text built from request values (raw SQL with pg, mysql2, sqlite, Sequelize, Knex, TypeORM, Prisma)'
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      asvs: 'OWASP ASVS 5.0 V1.2.4 (parameterized queries)'
      confidence: HIGH
      limitations: >-
        Follows a request value within one file (needs opengrep --taint-intrafile, which this kit passes). A value
        handed to a function in another file that builds the SQL there is missed, and so are query builders and ORMs
        used with raw fragments other than the calls listed in pattern-sinks. NoSQL queries are not covered.
    mode: taint
    pattern-sources:
      # Express, Koa, Fastify and similar: request objects named req, request or ctx. The name check keeps db.query
      # (a method) from being read as req.query (a request value).
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.cookies
              - pattern: $REQ.signedCookies
              - pattern: $REQ.headers
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.request.body
              # Next.js and Fetch-style handlers.
              - pattern: await $REQ.json()
              - pattern: await $REQ.formData()
              - pattern: $REQ.nextUrl.searchParams
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|context|c\.req|event)$
      # NestJS: parameters taken from the request with a decorator.
      - patterns:
          - pattern-either:
              - pattern: |
                  function $F(..., @Body(...) $P, ...) { ... }
              - pattern: |
                  function $F(..., @Query(...) $P, ...) { ... }
              - pattern: |
                  function $F(..., @Param(...) $P, ...) { ... }
              - pattern: |
                  function $F(..., @Headers(...) $P, ...) { ... }
          - focus-metavariable: $P
    pattern-propagators:
      - pattern: $DST = $SRC
        from: $SRC
        to: $DST
    pattern-sanitizers:
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: $X.escape(...)
      - pattern: $X.escapeId(...)
      - pattern: $X.escapeLiteral(...)
      - pattern: $X.escapeIdentifier(...)
      # Placeholders built from a list: ids.map(() => '?').join(',')
      - pattern: '$X.map(() => "?")'
      - pattern: '$X.map(($A) => "?")'
      - pattern: '$X.map(($A, $I) => `$${$E}`)'
    pattern-sinks:
      # The first argument is the SQL text. Values passed in later arguments are safe.
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
              - pattern: $DB.raw($SQL, ...)
              - pattern: $DB.all($SQL, ...)
              - pattern: $DB.get($SQL, ...)
              - pattern: $DB.run($SQL, ...)
              - pattern: $DB.exec($SQL, ...)
              - pattern: $DB.prepare($SQL, ...)
          # Only receivers named like a database handle, so Map.get or RegExp.exec are not matched.
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)(.*\.)?(\w*db|database|sqlite\w*|conn|connection|pool|client|knex|sequelize|sql|tx|trx|manager|entitymanager|datasource|queryrunner|\w*repo(sitory)?)$
          - focus-metavariable: $SQL
      - patterns:
          - pattern-either:
              - pattern: $P.$queryRawUnsafe($SQL, ...)
              - pattern: $P.$executeRawUnsafe($SQL, ...)
              - pattern: Prisma.raw($SQL)
          - focus-metavariable: $SQL
